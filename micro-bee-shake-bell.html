<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微蜂晃動叫人鈴 - DIY智能家居改造及電腦、手機、平板操作輔具</title>
    <link rel="stylesheet" href="style.css?v=2.0">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Image Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: contain;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            z-index: 1001;
        }
        .modal-close:hover,
        .modal-close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header class="top-bar">
        <div class="container">
            <span><a href="index.html" style="color: white; text-decoration: none;">DIY智能家居改造及電腦、手機、平板操作輔具 micro:bit
                    應用</a></span>
        </div>
    </header>

    <main class="content-container">
        <h1 class="main-title big-blue-title">微蜂晃動叫人鈴</h1>

        <section class="content-section">
            <h2 class="section-subtitle">說明影片</h2>

            <div class="video-responsive-wrapper">
                <!-- YouTube 影片嵌入預留位置 -->
                <iframe width="640" height="360" src="https://www.youtube.com/embed/dlLc6jTdd88" title="微蜂晃動叫人鈴使用說明"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>

            <div class="info-links">
                <a href="docs/Shake_Pager_System.pdf" class="primary-btn" target="_blank" style="margin-bottom: 20px; display: inline-block;">微蜂晃動叫人鈴-使用情境及說明</a>
                
                <div class="instructions-box" style="background-color: var(--background-gray); border: 1px solid #cbd5e1; border-radius: 8px; padding: 20px; margin-top: 10px; margin-bottom: 30px; text-align: left; max-width: 800px; box-sizing: border-box;">
                    <h3 style="font-size: 18px; font-weight: bold; margin-bottom: 12px; color: var(--dark-blue);">操作說明</h3>
                    <ol style="line-height: 1.8; font-size: 16px; padding-left: 20px; color: var(--text-color); margin-bottom: 12px;">
                        <li>呼叫器：晃動5次進行呼叫。</li>
                        <li>觸發接收器。</li>
                    </ol>
                    <ul style="list-style-type: none; padding-left: 0; line-height: 1.8; font-size: 15px; color: #555;">
                        <li style="margin-bottom: 6px;">※ 晃動未完整時，將會等候30秒後自動退出重新計算。</li>
                        <li>※ 按下呼叫器按鈕A、B可以強制關閉接收器音樂</li>
                    </ul>
                </div>
                
                <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px; margin-top: 20px; margin-bottom: 20px;">
                    <div style="flex: 2; min-width: 300px;">
                        <div style="position: relative;">
                            <!-- 接線圖 -->
                            <img src="diagram/晃動叫人鈴接線圖.PNG" alt="微蜂晃動叫人鈴接線圖" style="width: 100%; height: auto; display: block; cursor: pointer;" onclick="openModal('diagram/晃動叫人鈴接線圖.PNG')" title="點擊放大">
                        </div>
                    </div>
                    
                    <div class="materials-info" style="flex: 1; min-width: 250px; margin-top: 0;">
                        <h2 class="section-subtitle" style="margin-bottom: 15px;">微蜂晃動叫人鈴材料</h2>
                        <ol style="line-height: 1.8; font-size: 16px; padding-left: 24px; color: #333;">
                            <li>Micro:Bit V2 2片 (1台接收、1台傳送)</li>
                            <li>USB-A TO Micro USB 訊號線 2條</li>
                            <li>5V/1A充電頭 2個</li>
                            <li>充電電池模組(KS B040) 2個 ※ 可選</li>
                        </ol>
                    </div>
                </div>
            </div>
        </section>

        <div class="footer-action">
            <a href="index.html" class="primary-btn home-btn">HOME</a>
        </div>

    </main>

    <!-- Image Modal -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script>
        function openModal(imageSrc) {
            document.getElementById('imageModal').style.display = "block";
            document.getElementById('modalImage').src = imageSrc;
        }
        
        function closeModal() {
            document.getElementById('imageModal').style.display = "none";
        }
    </script>
<script src="sidebar.js?v=8"></script>
</body>

</html>
